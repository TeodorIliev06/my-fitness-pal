image: eclipse-temurin:17

stages:
  - build
  - verify

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - chmod +x gradlew
  - export GRADLE_USER_HOME=`pwd`/.gradle

.push_gradle_cache:
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

.pull_gradle_cache:
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle

compile:
  extends: .push_gradle_cache
  stage: build
  script: ./gradlew compileJava compileTestJava

unit test:
  stage: verify
  extends: .pull_gradle_cache
  script: ./gradlew test
  artifacts:
    when: always
    expose_as: 'Unit Test Report'
    expire_in: 1 week
    paths:
      - build/reports/tests/test/
    reports:
      junit: build/test-results/test/TEST-*.xml

checkstyle:
  stage: verify
  extends: .pull_gradle_cache
  script: ./gradlew checkstyleMain checkstyleTest
  artifacts:
    when: always
    expose_as: 'Checkstyle Report'
    expire_in: 1 week
    paths:
      - build/reports/checkstyle/

jacoco:
  stage: verify
  extends: .pull_gradle_cache
  script: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -PciJacoco --continue
  after_script: ./config/coverage.sh
  coverage: '/Line Coverage: \d+\.\d+%/'
  artifacts:
    when: always
    expose_as: 'Code Coverage Report'
    expire_in: 1 week
    paths:
      # build/reports/jacoco/test/jacocoTestReport.xml - so remove "html/" if needed
      - build/reports/jacoco/test/html/
    reports:
      coverage_report:
        coverage_format: jacoco
        path: build/reports/jacoco/test/jacocoTestReport.xml
